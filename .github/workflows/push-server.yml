name: Push-Server-Image bauen

on:
  push:
    branches: [main]
    paths:
      - 'push-server/**'
      - '.github/workflows/push-server.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: push-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/2pac1991/bestel-app-push:latest
          labels: |
            org.opencontainers.image.source=https://github.com/2pac1991/bestel-app
            org.opencontainers.image.title=Bestellliste Push-Server
